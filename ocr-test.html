<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>受領書OCRテスト</title>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@7/dist/tesseract.min.js"></script>

  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    button {
      width: 100%;
      padding: 16px;
      font-size: 20px;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
    }

    #result {
      margin-top: 20px;
      white-space: pre-wrap;
      background: #f1f3f4;
      padding: 15px;
    }
  </style>
</head>

<body>

  <h2>受領書OCRテスト</h2>

  <input
    type="file"
    id="imageInput"
    accept="image/*"
    capture="environment"
    style="display:none"
  >

  <button onclick="document.getElementById('imageInput').click()">
    受領書を撮影
  </button>

  <div id="status">待機中</div>

  <div id="result"></div>

  <script>
    document.getElementById("imageInput")
      .addEventListener("change", async function(event) {

        const file = event.target.files[0];

        if (!file) return;

        const status = document.getElementById("status");
        const result = document.getElementById("result");

        status.innerText = "OCR準備中…";
        result.innerText = "";

        const startTime = performance.now();

        try {

          const worker = await Tesseract.createWorker("jpn+eng");

          status.innerText = "OCR処理中…";

          const ret = await worker.recognize(file);

          await worker.terminate();

          const seconds =
            ((performance.now() - startTime) / 1000).toFixed(1);

          status.innerText =
            "OCR完了：" + seconds + "秒";

          result.innerText = ret.data.text;

        } catch (err) {

          status.innerText =
            "OCRエラー：" + err;

        }

      });
  </script>

</body>
</html>
