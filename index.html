<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JANスキャナーテスト</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: #f1f3f4;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <h2>受入検品System5</h2>

  <p id="scanGuide">商品バーコードをカメラにかざしてください</p>
  
  <div id="reader"></div>

  <div id="result">
    JAN：未読取
  </div>

  <button
    id="endButton"
    style="
      width: 80%;
      margin-top: 20px;
      padding: 12px;
      font-size: 18px;
    "
  >
    検品を終了
  </button>

  <button
    id="restartButton"
    style="
      display: none;
      width: 80%;
      margin-top: 20px;
      padding: 12px;
      font-size: 18px;
    "
  >
    検品を再開
  </button>

  <div id="checkArea" style="display:none; margin-top:20px;">
  
    <input
      type="number"
      id="actualQty"
      min="0"
      inputmode="numeric"
      placeholder="実績数量"
      style="
        width: 80%;
        padding: 15px;
        font-size: 22px;
        text-align: center;
        box-sizing: border-box;
      "
    >
  
    <button
      id="checkButton"
      style="
        width: 80%;
        margin-top: 15px;
        padding: 15px;
        font-size: 22px;
        font-weight: bold;
      "
    >
      確定
    </button>
  
    <div
      id="checkResult"
      style="
        margin-top: 20px;
        font-size: 24px;
        font-weight: bold;
      "
    ></div>
  
  </div>  

  <script>
    let html5QrCode;
    let alreadyRead = false;
    let currentJan = "";
    let currentProductName = "";
    let currentExpectedQty = 0;
    let currentInspectionId = "";

    const GAS_URL = "https://script.google.com/macros/s/AKfycbzPHm9nE4pKvfjKeD4Wc0R-326sc-OWbb4c893Q9MDY2Rih12i0NOKlfEbrhAIZ1ns/exec";

    async function startScanner() {

      document.getElementById("scanGuide").style.display = "block";

      html5QrCode = new Html5Qrcode("reader");

      try {

        const cameras = await Html5Qrcode.getCameras();

        if (!cameras || cameras.length === 0) {
          document.getElementById("result").innerText =
            "カメラが見つかりません";
          return;
        }

        // camera 0 = 背面カメラ
        const backCamera = cameras.find(camera =>
          camera.label.toLowerCase().includes("back")
        );

        const cameraId = backCamera
          ? backCamera.id
          : cameras[cameras.length - 1].id;

        await html5QrCode.start(
          cameraId,
          {
            fps: 10,
            qrbox: {
              width: 280,
              height: 120
            }
          },
          onScanSuccess
        );

      } catch (err) {

        document.getElementById("result").innerText =
          "カメラ起動エラー：" + err;
      }
    }


    async function onScanSuccess(decodedText) {

      if (alreadyRead) return;

      const jan = decodedText.trim();

      if (!/^\d{13}$/.test(jan)) {
        return;
      }

      alreadyRead = true;

      document.getElementById("result").innerText =
        "JAN：" + jan + "\n検索中...";

      try {
        await html5QrCode.stop();
        document.getElementById("scanGuide").style.display = "none";
      } catch (e) {
        console.log(e);
      }

      try { 
        const fetchStart = performance.now();
        const response = await fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "searchJan",
          janCode: jan
        })
      });

      const fetchEnd = performance.now();
      console.log("GAS通信時間：" + (fetchEnd - fetchStart) + "ms");

      const data = await response.json();

      const totalTime = performance.now() - fetchStart;
      document.getElementById("result").innerText =
        "JAN：" + jan +
        "\n検索時間：" + Math.round(totalTime) + "ms";

      if (data.found) {
        currentJan = jan;
        currentProductName = data.productName;
        currentExpectedQty = Number(data.expectedQty);
        currentInspectionId = crypto.randomUUID();

        document.getElementById("result").innerText =
          "JAN：" + jan +
          "\n商品名：" + data.productName +
          "\n受領予定：" + data.expectedQty +
          "\n登録済み：" + data.registeredQty +
          (data.remainingQty < 0
            ? "\n超過：" + Math.abs(data.remainingQty)
            : "\n残り：" + data.remainingQty) +
          "\n入力履歴：" +
          (data.history.length > 0
            ? data.history.join("個、") + "個"
            : "なし");          document.getElementById("checkArea").style.display = "block";
          document.getElementById("actualQty").value = "";
          document.getElementById("checkResult").innerText = "";
          document.getElementById("actualQty").focus();
      } else {

        document.getElementById("result").innerText =
          "JAN：" + jan +
          "\n受領データにありません";
        }

      } catch (err) {

        document.getElementById("result").innerText =
          "JAN：" + jan +
          "\n通信エラー：" + err;
      }
    }
    
    window.addEventListener("load", startScanner);
    document.getElementById("checkButton").addEventListener("click", async function() {
      const checkButton = document.getElementById("checkButton");
      
      if (checkButton.disabled) {
        return;
      }
      
      checkButton.disabled = true;
      checkButton.innerText = "保存中…";
    
      const actualQty = Number(document.getElementById("actualQty").value);
    
      if (document.getElementById("actualQty").value === "") {
      
        checkButton.disabled = false;
        checkButton.innerText = "確定";
      
        document.getElementById("checkResult").innerText =
          "実績数量を入力してください";
      
        return;
      }
    
      try {
      
        const response = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "saveInspection",
            janCode: currentJan,
            productName: currentProductName,
            expectedQty: currentExpectedQty,
            actualQty: actualQty,
            inspectionId: currentInspectionId
          })
        });
      
        const saveResult = await response.json();
      
        if (saveResult.success) {
          checkButton.disabled = false;
          checkButton.innerText = "確定";
        
          // 次の商品を読める状態に戻す
          alreadyRead = false;
        
          currentJan = "";
          currentProductName = "";
          currentExpectedQty = 0;
          currentInspectionId = "";
        
          document.getElementById("checkArea").style.display = "none";
          document.getElementById("actualQty").value = "";
          document.getElementById("checkResult").innerText = "";
        
          document.getElementById("result").innerText =
            "保存完了。次の商品をスキャンしてください";
        
          // カメラを自動で再起動
          await startScanner();
        
        } else {
          
          checkButton.disabled = false;
          checkButton.innerText = "確定";
        
          document.getElementById("checkResult").innerText +=
            "\n保存エラー";
        
        }
      
        } catch (err) {
        
          checkButton.disabled = false;
          checkButton.innerText = "確定";
        
          document.getElementById("checkResult").innerText +=
            "\n保存エラー：" + err;
        
        }
    });

    document.getElementById("endButton").addEventListener("click", async function() {
    
      try {
        if (html5QrCode && html5QrCode.isScanning) {
          await html5QrCode.stop();
        }
      } catch (e) {
        console.log(e);
      }
    
      document.getElementById("reader").style.display = "none";
      document.getElementById("scanGuide").style.display = "none";
      document.getElementById("checkArea").style.display = "none";
      document.getElementById("endButton").style.display = "none";
      document.getElementById("restartButton").style.display = "inline-block";
    
      document.getElementById("result").innerText =
        "検品を終了しました";
    });

    document.getElementById("restartButton").addEventListener("click", async function() {
    
      document.getElementById("restartButton").style.display = "none";
      document.getElementById("endButton").style.display = "inline-block";
      document.getElementById("reader").style.display = "block";
    
      document.getElementById("result").innerText =
        "JAN：未読取";
    
      alreadyRead = false;
    
      await startScanner();
    });
  </script>

</body>
</html>
