<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JANスキャナーテスト</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: #f1f3f4;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <h2>JANスキャナーテスト</h2>

  <p>商品バーコードをカメラにかざしてください</p>

  <div id="reader"></div>

  <div id="result">
    JAN：未読取
  </div>

  <div id="checkArea" style="display:none; margin-top:20px;">
  
    <input
      type="number"
      id="actualQty"
      min="0"
      inputmode="numeric"
      placeholder="実績数量"
      style="
        width: 80%;
        padding: 15px;
        font-size: 22px;
        text-align: center;
        box-sizing: border-box;
      "
    >
  
    <button
      id="checkButton"
      style="
        width: 80%;
        margin-top: 15px;
        padding: 15px;
        font-size: 22px;
        font-weight: bold;
      "
    >
      検品
    </button>
  
    <div
      id="checkResult"
      style="
        margin-top: 20px;
        font-size: 24px;
        font-weight: bold;
      "
    ></div>
  
  </div>  

  <script>
    let html5QrCode;
    let alreadyRead = false;

    const GAS_URL = "https://script.google.com/macros/s/AKfycbzPHm9nE4pKvfjKeD4Wc0R-326sc-OWbb4c893Q9MDY2Rih12i0NOKlfEbrhAIZ1ns/exec";

    async function startScanner() {

      html5QrCode = new Html5Qrcode("reader");

      try {

        const cameras = await Html5Qrcode.getCameras();

        if (!cameras || cameras.length === 0) {
          document.getElementById("result").innerText =
            "カメラが見つかりません";
          return;
        }

        // camera 0 = 背面カメラ
        const backCamera = cameras.find(camera =>
          camera.label.toLowerCase().includes("back")
        );

        const cameraId = backCamera
          ? backCamera.id
          : cameras[cameras.length - 1].id;

        await html5QrCode.start(
          cameraId,
          {
            fps: 10,
            qrbox: {
              width: 280,
              height: 120
            }
          },
          onScanSuccess
        );

      } catch (err) {

        document.getElementById("result").innerText =
          "カメラ起動エラー：" + err;
      }
    }


    async function onScanSuccess(decodedText) {

      if (alreadyRead) return;

      const jan = decodedText.trim();

      if (!/^\d{13}$/.test(jan)) {
        return;
      }

      alreadyRead = true;

      document.getElementById("result").innerText =
        "JAN：" + jan + "\n検索中...";

      try {
        await html5QrCode.stop();
      } catch (e) {
        console.log(e);
      }

      try {

        const response = await fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "searchJan",
          janCode: jan
        })
      });

      const data = await response.json();

      if (data.found) {

        document.getElementById("result").innerText =
          "JAN：" + jan +
          "\n商品名：" + data.productName +
          "\n予定数量：" + data.expectedQty;
          document.getElementById("checkArea").style.display = "block";
          document.getElementById("actualQty").value = "";
          document.getElementById("checkResult").innerText = "";
          document.getElementById("actualQty").focus();
      } else {

        document.getElementById("result").innerText =
          "JAN：" + jan +
          "\n受領データにありません";
        }

      } catch (err) {

        document.getElementById("result").innerText =
          "JAN：" + jan +
          "\n通信エラー：" + err;
      }
    }
    
    window.addEventListener("load", startScanner);
    document.getElementById("checkButton").addEventListener("click", function() {
    
      const actualQty = Number(document.getElementById("actualQty").value);
    
      if (document.getElementById("actualQty").value === "") {
        document.getElementById("checkResult").innerText =
          "実績数量を入力してください";
        return;
      }
    
      const resultText = document.getElementById("result").innerText;
      const match = resultText.match(/予定数量：(\d+)/);
    
      if (!match) {
        document.getElementById("checkResult").innerText =
          "予定数量を取得できません";
        return;
      }
    
      const expectedQty = Number(match[1]);
    
      if (actualQty === expectedQty) {
        document.getElementById("checkResult").innerText =
          "○ 一致";
      } else {
        document.getElementById("checkResult").innerText =
          "× 不一致　差異：" + (actualQty - expectedQty);
      }
    });
  </script>

</body>
</html>
