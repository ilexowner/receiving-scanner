<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JANスキャナーテスト</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: #f1f3f4;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <h2>JANスキャナーテスト</h2>

  <p>商品バーコードをカメラにかざしてください</p>

  <div id="reader"></div>

  <div id="result">
    JAN：未読取
  </div>

  <script>
    let html5QrCode;
    let alreadyRead = false;

    const GAS_URL = "https://script.google.com/macros/s/AKfycbzPHm9nE4pKvfjKeD4Wc0R-326sc-OWbb4c893Q9MDY2Rih12i0NOKlfEbrhAIZ1ns/exec";

    async function startScanner() {

      html5QrCode = new Html5Qrcode("reader");

      try {

        const cameras = await Html5Qrcode.getCameras();

        if (!cameras || cameras.length === 0) {
          document.getElementById("result").innerText =
            "カメラが見つかりません";
          return;
        }

        // camera 0 = 背面カメラ
        const backCamera = cameras.find(camera =>
          camera.label.toLowerCase().includes("back")
        );

        const cameraId = backCamera
          ? backCamera.id
          : cameras[cameras.length - 1].id;

        await html5QrCode.start(
          cameraId,
          {
            fps: 10,
            qrbox: {
              width: 280,
              height: 120
            }
          },
          onScanSuccess
        );

      } catch (err) {

        document.getElementById("result").innerText =
          "カメラ起動エラー：" + err;
      }
    }


    async function onScanSuccess(decodedText) {

      if (alreadyRead) return;

      const jan = decodedText.trim();

      if (!/^\d{13}$/.test(jan)) {
        return;
      }

      alreadyRead = true;

      document.getElementById("result").innerText =
        "JAN：" + jan + "\n検索中...";

      try {
        await html5QrCode.stop();
      } catch (e) {
        console.log(e);
      }

      try {

        const response = await fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "searchJan",
          janCode: jan
        })
      });

      const data = await response.json();

      if (data.found) {

        document.getElementById("result").innerText =
          "JAN：" + jan +
          "\n商品名：" + data.productName +
          "\n予定数量：" + data.expectedQty;

      } else {

        document.getElementById("result").innerText =
          "JAN：" + jan +
          "\n受領データにありません";
        }

      } catch (err) {

        document.getElementById("result").innerText =
          "JAN：" + jan +
          "\n通信エラー：" + err;
      }
    }
    
    window.addEventListener("load", startScanner);
  </script>

</body>
</html>
